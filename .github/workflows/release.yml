name: Release

# Tagging `vX.Y.Z` cuts a release: the editor binary, the Blender addon built
# for every platform an artist might be on, and notes from CHANGELOG.md.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # create the release and upload its files

jobs:
  editor:
    name: Editor binary (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # rustup honours rust-toolchain.toml and installs the pinned nightly
      # on first use; no Nix on Windows.
      - name: Show toolchain
        shell: bash
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        shell: bash
        run: cargo build --release -p demiurg-app

      - name: Name the asset
        shell: bash
        run: cp target/release/demiurg.exe "demiurg-${GITHUB_REF_NAME}-windows-x64.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: editor-windows
          path: demiurg-*-windows-x64.exe
          if-no-files-found: error

  # Reused rather than repeated: the addon is built the same way for a release
  # as it is on an ordinary push, so there is one definition to keep correct.
  # The tag becomes the extension's version, so the zip an artist installs says
  # which release it came from instead of carrying a number of its own.
  addon:
    name: Blender addon
    uses: ./.github/workflows/blender-addon.yml
    with:
      version: ${{ github.ref_name }}

  publish:
    name: Publish release
    needs: [editor, addon]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Named explicitly rather than by pattern: the per-platform converter
      # artifacts are build inputs, not release assets, and must not be
      # attached.
      - uses: actions/download-artifact@v4
        with:
          name: editor-windows
          path: release

      - uses: actions/download-artifact@v4
        with:
          name: blender-addon
          path: release

      - name: Extract release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { grab = 1; next }
            grab && /^## \[/         { exit }
            grab && /^\[[^][]+\]:/   { exit }   # stop at the link-ref block
            grab                     { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release ${GITHUB_REF_NAME}." > release-notes.md
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: release/*
          fail_on_unmatched_files: true
